<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Audora voice test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%232d5bff%27/%3E%3C/svg%3E">
<style>
  :root { --ink:#1b1b1f; --mute:#6b6b76; --line:#e4e4ea; --bg:#f7f7f9; --card:#fff; --acc:#2d5bff; --acc2:#eaf0ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:24px; margin:8px 0 6px; }
  h2 { font-size:19px; margin:0 0 8px; }
  p { margin:8px 0; }
  .mute { color:var(--mute); font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  .line { font-size:18px; line-height:1.5; font-style:italic; }
  .tag { display:inline-block; background:var(--acc2); color:var(--acc); font-weight:600; border-radius:999px; padding:4px 12px; font-size:14px; margin-bottom:8px; }
  .player { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .player:first-of-type { border-top:0; }
  .player b { width:64px; flex:none; }
  audio { flex:1; min-width:0; height:40px; }
  .opts { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  button { font:inherit; }
  .opt { flex:1 1 60px; min-height:48px; border:2px solid var(--line); background:#fff; border-radius:12px; font-weight:600; cursor:pointer; }
  .opt.on { border-color:var(--acc); background:var(--acc2); color:var(--acc); }
  .opt.wide { flex:1 1 100%; font-weight:500; }
  .btn { display:block; width:100%; min-height:52px; border:0; border-radius:12px; background:var(--acc); color:#fff; font-weight:700; font-size:18px; cursor:pointer; margin-top:14px; text-align:center; text-decoration:none; line-height:52px; padding:0; }
  .btn:disabled { background:#b9c3e6; cursor:default; }
  .btn.ghost { background:transparent; color:var(--acc); border:2px solid var(--acc); line-height:48px; }
  .btn.wa { background:#25d366; }
  .row { display:flex; gap:10px; }
  input { width:100%; font:inherit; padding:12px; border:2px solid var(--line); border-radius:12px; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; background:#f1f1f5; border-radius:10px; padding:12px; word-break:break-all; user-select:all; -webkit-user-select:all; }
  .prog { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:4px 0 12px; }
  .prog i { display:block; height:100%; background:var(--acc); transition:width .3s; }
  a.small { color:var(--mute); font-size:14px; }
</style>
</head>
<body>
<main id="app"><p class="mute">Loading…</p></main>
<script>
(() => {
  const KEY = 'audora-friends-v1';
  const CHARS = ['narrator', 'armitage', 'molly'];
  const app = document.getElementById('app');
  let M = null;   // manifest (trials.json)
  let S = null;   // this listener's session

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(S));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cellOf = id => M.cells.find(c => c.id === id);
  const top = () => window.scrollTo(0, 0);

  function newSession(name) {
    const picks = CHARS.map(ch => {
      const cells = M.cells.filter(c => c.char === ch);
      const cell = cells[Math.floor(Math.random() * cells.length)];
      return { cell: cell.id, order: shuffle([...cell.clips]) };
    });
    S = { name: name.trim().slice(0, 20).replace(/[|\s]+/g, ' ').trim(), picks, answers: {}, step: 0, done: false };
    save();
  }

  function code() {
    const n = M.prefix_len || 4;
    const parts = S.picks.map(p => {
      const c = cellOf(p.cell), a = S.answers[p.cell] || {};
      const q1 = a.q1 === 'x' ? 'x' : (a.q1 || '?').slice(0, n);
      const q2 = (a.q2 || '?').slice(0, n);
      return `${c.char[0]}${c.emo[0]} ${q1}/${q2}`;
    });
    return `AUDORA1 ${S.name || 'anon'} | ${parts.join(' | ')}`;
  }

  function render() {
    if (!S) return renderIntro();
    if (S.done) return renderDone();
    renderLine(S.step);
  }

  function renderIntro() {
    app.innerHTML = `
      <h1>Audora voice test</h1>
      <p>Three short clips, three times. Takes about <b>3 minutes</b>.</p>
      <p class="mute">You will hear the same line read by three different voices and pick the one you like. Headphones help but are not required.</p>
      <div class="card">
        <label for="nm"><b>Your first name</b> <span class="mute">(optional)</span></label>
        <input id="nm" autocomplete="given-name" placeholder="e.g. Ravi" style="margin-top:8px">
      </div>
      <button class="btn" id="start">Start</button>`;
    document.getElementById('start').onclick = () => { newSession(document.getElementById('nm').value); render(); };
  }

  function renderLine(step) {
    const p = S.picks[step], c = cellOf(p.cell);
    const a = S.answers[p.cell] || {};
    const emo = c.emo;
    app.innerHTML = `
      <p class="mute">Line ${step + 1} of 3</p>
      <div class="prog"><i style="width:${(step / 3) * 100}%"></i></div>
      <div class="card">
        <span class="tag">${esc(c.char_label)} · meant to sound ${esc(emo).toUpperCase()}</span>
        <p class="line">“${esc(c.text)}”</p>
      </div>
      <div class="card">
        <p class="mute" style="margin-top:0">Listen to all three. Tap play on each.</p>
        ${p.order.map((id, i) => `
          <div class="player"><b>Voice ${i + 1}</b>
            <audio controls preload="metadata" src="clips/${id}.m4a"></audio></div>`).join('')}
      </div>
      <div class="card">
        <h2>1. Which one sounds the most ${esc(emo)}?</h2>
        <div class="opts" data-q="q1">
          ${p.order.map((id, i) => `<button class="opt ${a.q1 === id ? 'on' : ''}" data-v="${id}">Voice ${i + 1}</button>`).join('')}
          <button class="opt wide ${a.q1 === 'x' ? 'on' : ''}" data-v="x">Can't tell</button>
        </div>
      </div>
      <div class="card">
        <h2>2. Which one would you rather listen to in an audiobook?</h2>
        <div class="opts" data-q="q2">
          ${p.order.map((id, i) => `<button class="opt ${a.q2 === id ? 'on' : ''}" data-v="${id}">Voice ${i + 1}</button>`).join('')}
        </div>
      </div>
      <div class="row">
        ${step > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}
        <button class="btn" id="next" ${a.q1 && a.q2 ? '' : 'disabled'}>${step === 2 ? 'Finish' : 'Next'}</button>
      </div>
      <p style="text-align:center;margin-top:18px"><a class="small" href="#" id="reset">Start over</a></p>`;

    const auds = [...app.querySelectorAll('audio')];
    auds.forEach(x => x.addEventListener('play', () => auds.forEach(y => { if (y !== x) y.pause(); })));

    app.querySelectorAll('.opts').forEach(g => g.onclick = e => {
      const b = e.target.closest('.opt'); if (!b) return;
      S.answers[p.cell] = { ...(S.answers[p.cell] || {}), [g.dataset.q]: b.dataset.v };
      save();
      g.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
      const an = S.answers[p.cell];
      document.getElementById('next').disabled = !(an.q1 && an.q2);
    });
    document.getElementById('next').onclick = () => { if (step === 2) S.done = true; else S.step = step + 1; save(); top(); render(); };
    const bk = document.getElementById('back'); if (bk) bk.onclick = () => { S.step = step - 1; save(); top(); render(); };
    document.getElementById('reset').onclick = e => { e.preventDefault(); if (confirm('Clear your answers and start again?')) { localStorage.removeItem(KEY); S = null; render(); } };
  }

  function renderDone() {
    const txt = code();
    const wa = `https://wa.me/${M.whatsapp || ''}?text=${encodeURIComponent(txt)}`;
    app.innerHTML = `
      <h1>Thank you${S.name ? ', ' + esc(S.name) : ''}!</h1>
      <p>That's it. Please send this result back to the person who shared the test.</p>
      <div class="card">
        <p class="mute" style="margin-top:0">Your result code</p>
        <div class="code" id="codebox">${esc(txt)}</div>
      </div>
      <a class="btn wa" href="${wa}" target="_blank" rel="noopener">Send on WhatsApp</a>
      <button class="btn ghost" id="copy">Copy code</button>
      ${navigator.share ? '<button class="btn ghost" id="share">Share…</button>' : ''}
      <p style="text-align:center;margin-top:18px"><a class="small" href="#" id="again">Take it again with different lines</a></p>`;
    document.getElementById('copy').onclick = async () => {
      const b = document.getElementById('copy');
      try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied'; }
      catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('codebox')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Select and copy the code above'; }
    };
    const sh = document.getElementById('share'); if (sh) sh.onclick = () => navigator.share({ text: txt }).catch(() => {});
    document.getElementById('again').onclick = e => { e.preventDefault(); newSession(S.name); top(); render(); };
  }

  fetch('trials.json', { cache: 'no-store' }).then(r => r.json()).then(m => {
    M = m;
    S = load();
    if (S && !(S.picks && S.picks.every(p => cellOf(p.cell)))) S = null;   // manifest changed since last visit
    render();
  }).catch(e => { app.innerHTML = `<p>Could not load the test. ${esc(e)}</p>`; });
})();
</script>
</body>
</html>
